resources:
  jobs:
    Pipeline_ELT_Compras:
      name: Pipeline ELT Compras
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: databricks/01_bronze_layer
            source: GIT
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: databricks/02_silver_layer
            source: GIT
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: databricks/03_gold_layer
            source: GIT
      git_source:
        git_url: https://github.com/Neyser09/Azure-Projects.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      parameters:
        - name: tipo_carga
          default: Incremental
        - name: fecha_carga
          default: 2025-06-30
      performance_target: PERFORMANCE_OPTIMIZED
